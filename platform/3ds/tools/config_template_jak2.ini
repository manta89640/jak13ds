# Jak II (3DS) settings. Change a value after the "=", save, then restart the game.
# (AI-assisted) Baseline build: the game logic runs unmodified; the 3DS renderer draws Jak II's
# level backgrounds, characters, sky and clouds, particles, shadows, texture animations, a flat
# ocean, the HUD, text and the minimap, with sound and music (screen effects are missing).

# normal (the defaults: fewer city people and cars, simpler far scenery and smoke, the PS2's shadow
# distances, for a steady 30 fps) | full (the most detail; slower in Haven City) | safe (the older,
# proven renderer settings)
preset = normal

# game sound and music: on | off. Needs sdmc:/3ds/dspfirm.cdc (dump it once with the DSP1 homebrew)
sound = on

# what draws the game: ctr (the 3DS renderer) | null (no picture; the game runs and logs its timing)
renderer = ctr
