# Jak II (3DS) settings. Change a value after the "=", save, then restart the game.
# (AI-assisted) Baseline build: the game logic runs unmodified; the 3DS renderer draws Jak II's
# level backgrounds, characters, sky and clouds, particles, shadows, the HUD, text and the minimap
# (work in progress: some texture animations, the ocean and the screen effects are missing).

# normal (the defaults) | safe (the older, proven renderer settings)
preset = normal

# game sound and music: on | off. Needs sdmc:/3ds/dspfirm.cdc (dump it once with the DSP1 homebrew)
sound = on

# what draws the game: ctr (the 3DS renderer) | null (no picture; the game runs and logs its timing)
renderer = ctr
